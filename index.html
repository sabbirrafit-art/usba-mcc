<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>USBA MCC</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2A47">
<meta name="description" content="USBA MCC fleet defect control">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="USBA MCC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* The app shell: the MCC web app fills the screen; this page only adds the icon, splash and offline notice. */
  :root{--navy:#0E2A47;--ink:#C9D5E3}
  html,body{margin:0;height:100%;background:#fff;overflow:hidden;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);width:100%;height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;display:block;background:#EEF1F5}
  .cover{position:fixed;inset:0;z-index:2;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;transition:opacity .3s}
  .cover[hidden]{display:none}
  .cover.fade{opacity:0;pointer-events:none}
  .cover img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .cover h1{margin:4px 0 0;font-size:24px;letter-spacing:.02em}
  .cover p{margin:0;color:var(--ink);max-width:34ch}
  .bar{width:140px;height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#6FA3E8;animation:run 1.1s ease-in-out infinite}
  @keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
  .cover button,.cover a{font:inherit;font-weight:600;color:var(--navy);background:#fff;border:0;border-radius:10px;padding:11px 20px;text-decoration:none;cursor:pointer}
  .cover .slow{display:none}
  .cover.is-slow .slow{display:block}
</style>
</head>
<body>
  <!-- CHANGE THIS if you ever create a brand-new deployment (Deploy -> New deployment gives a new link).
       "Manage deployments -> Edit -> New version" keeps the same link, so normally nothing to change. -->
  <script>window.MCC_URL = 'https://script.google.com/macros/s/AKfycbzvbLvVB3-Y1UlY6oA9J1tgNJA7plWFl7eY2nHf4NBk0kq4jNYUku1ljJ1FcRfkVFBGpw/exec';</script>

  <iframe id="app" title="USBA MCC" allow="clipboard-read; clipboard-write; fullscreen; camera"></iframe>

  <div class="cover" id="splash">
    <img src="icons/icon-192.png" alt="">
    <h1>USBA MCC</h1>
    <div class="bar"><i></i></div>
    <p class="slow">Still loading. A slow connection can take a while.</p>
    <a class="slow" id="direct" href="#" target="_blank" rel="noopener">Open in the browser instead</a>
  </div>

  <div class="cover" id="offline" hidden>
    <img src="icons/icon-192.png" alt="">
    <h1>No connection</h1>
    <p>USBA MCC needs the internet to reach the master Google Sheet. Connect to Wi-Fi or mobile data and try again.</p>
    <button type="button" id="retry">Try again</button>
  </div>

<script>
(function () {
  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');
  var offline = document.getElementById('offline');
  document.getElementById('direct').href = window.MCC_URL;
  var slowT;
  function start() {
    if (!navigator.onLine) { offline.hidden = false; return; }
    offline.hidden = true;
    splash.hidden = false; splash.classList.remove('fade', 'is-slow');
    clearTimeout(slowT);
    slowT = setTimeout(function () { splash.classList.add('is-slow'); }, 15000);
    frame.src = window.MCC_URL;
  }
  frame.addEventListener('load', function () {
    if (!frame.getAttribute('src')) return;
    clearTimeout(slowT);
    splash.classList.add('fade');
    setTimeout(function () { splash.hidden = true; }, 350);
  });
  document.getElementById('retry').addEventListener('click', start);
  window.addEventListener('online', function () { if (!offline.hidden) start(); });
  window.addEventListener('offline', function () { offline.hidden = false; });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  start();
})();
</script>
</body>
</html>
